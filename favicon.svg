<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Nền bo góc giống logo-icon -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>
  <!-- Globe / Map icon -->
  <!-- Hình tròn quả địa cầu -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="white" stroke-width="2.5" opacity="0.95"/>
  <!-- Đường xích đạo -->
  <ellipse cx="32" cy="32" rx="18" ry="0" fill="none" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="14" y1="32" x2="50" y2="32" stroke="white" stroke-width="2" opacity="0.7"/>
  <!-- Đường kinh tuyến -->
  <ellipse cx="32" cy="32" rx="9" ry="18" fill="none" stroke="white" stroke-width="2" opacity="0.7"/>
  <!-- Đường vĩ tuyến trên -->
  <path d="M 19 22 Q 32 18 45 22" fill="none" stroke="white" stroke-width="1.8" opacity="0.7"/>
  <!-- Đường vĩ tuyến dưới -->
  <path d="M 19 42 Q 32 46 45 42" fill="none" stroke="white" stroke-width="1.8" opacity="0.7"/>
  <!-- Pin marker nhỏ ở trên -->
  <circle cx="32" cy="20" r="4" fill="white" opacity="0.95"/>
  <path d="M 32 24 L 32 30" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
</svg>
