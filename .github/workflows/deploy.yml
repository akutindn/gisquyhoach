name: Deploy to PA Vietnam FTP

on:
  push:
    branches:
      - main # Chạy tự động mỗi khi có thay đổi trên nhánh main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /domains/gisquyhoach.vn/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env.example
            .gitignore
            *.py
            *.zip
            *.md
