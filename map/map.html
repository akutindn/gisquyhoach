<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>GIS Quy Hoach Toan Quoc 2026 - Tim kiem dia phan tinh, xa</title>
<meta name="description" content="Ban do dia phan hanh chinh Viet Nam 2026. Tim kiem, tra cuu thong tin 63 tinh thanh va 3321 xa phuong toan quoc."/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/><text y='22' x='4' font-size='15' font-weight='900' fill='white' font-family='Arial'>QH</text></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
/* =============== TOKENS =============== */
:root{
  --B:#2563eb;--Bl:#3b82f6;--Bd:#1e40af;
  --G:#16a34a;--A:#f59e0b;--R:#ef4444;
  --TX:#111827;--TX2:#374151;--TX3:#6b7280;--TX4:#9ca3af;
  --BG:#f9fafb;--S1:#fff;--S2:#f3f4f6;--S3:#e5e7eb;
  --BD:#e5e7eb;--BD2:#d1d5db;
  --PANEL:380px;
  --TOP:56px;
  --sh1:0 1px 3px rgba(0,0,0,.08);
  --sh2:0 4px 12px rgba(0,0,0,.1);
  --sh3:0 8px 24px rgba(0,0,0,.12);
  --r4:4px;--r6:6px;--r8:8px;--r12:12px;--r16:16px;--r99:99px;
  --t:.18s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;color:var(--TX);background:var(--BG);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;outline:none}
input{font-family:inherit;outline:none;border:none}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--S3);border-radius:99px}

/* =============== LOADER =============== */
#ld{
  position:fixed;inset:0;z-index:9999;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .4s ease;
}
.ld-logo{display:flex;align-items:center;gap:10px}
.ld-ico{
  width:44px;height:44px;border-radius:10px;
  background:linear-gradient(135deg,var(--B),#06b6d4);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;color:#fff;
}
.ld-name{font-size:20px;font-weight:800;color:var(--TX)}
.ld-name span{color:var(--B)}
.ld-dots{display:flex;gap:6px}
.ld-dot{width:8px;height:8px;border-radius:50%;background:var(--S3);animation:dotpop .9s ease infinite}
.ld-dot:nth-child(1){animation-delay:0s;background:var(--B)}
.ld-dot:nth-child(2){animation-delay:.15s}
.ld-dot:nth-child(3){animation-delay:.3s}
@keyframes dotpop{0%,80%,100%{transform:scale(.6);background:var(--S3)}40%{transform:scale(1);background:var(--B)}}
.ld-msg{font-size:13px;color:var(--TX3)}

/* =============== TOPBAR =============== */
#top{
  position:fixed;top:0;left:0;right:0;height:var(--TOP);
  background:#fff;border-bottom:1px solid var(--BD);
  display:flex;align-items:center;gap:0;z-index:900;
  box-shadow:var(--sh1);
}
.top-logo{
  display:flex;align-items:center;gap:10px;
  padding:0 20px;border-right:1px solid var(--BD);
  height:100%;min-width:var(--PANEL);flex-shrink:0;
}
.top-logo-ico{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--B),#06b6d4);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;color:#fff;flex-shrink:0;
}
.top-logo-txt .n1{font-size:14px;font-weight:800;color:var(--TX)}
.top-logo-txt .n1 span{color:var(--B)}
.top-logo-txt .n2{font-size:10px;color:var(--TX4)}

/* Top search */
.top-search-wrap{flex:1;padding:0 16px;max-width:520px;position:relative}
.top-search{
  display:flex;align-items:center;gap:8px;
  height:38px;background:var(--BG);border:1.5px solid var(--BD);
  border-radius:var(--r99);padding:0 14px;
  transition:border-color var(--t),box-shadow var(--t);
}
.top-search:focus-within{border-color:var(--B);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.top-search i{color:var(--TX4);font-size:13px;flex-shrink:0}
#top-inp{flex:1;background:none;font-size:13px;color:var(--TX);min-width:0}
#top-inp::placeholder{color:var(--TX4)}
#top-inp-clear{color:var(--TX4);display:none;padding:2px;border-radius:3px;transition:color var(--t)}
#top-inp-clear:hover{color:var(--TX)}

/* Top search dropdown */
#top-dd{
  position:absolute;top:calc(100% + 8px);left:16px;right:0;
  background:#fff;border:1px solid var(--BD2);border-radius:var(--r12);
  overflow:hidden;box-shadow:var(--sh3);z-index:1000;display:none;
  max-height:340px;overflow-y:auto;
}
.tdd-hdr{
  padding:8px 14px;font-size:10px;font-weight:700;color:var(--TX3);
  text-transform:uppercase;letter-spacing:.6px;
  border-bottom:1px solid var(--BD);background:var(--S2);
  display:flex;align-items:center;justify-content:space-between;
}
.tdd-cnt{
  padding:2px 9px;border-radius:var(--r99);
  background:rgba(37,99,235,.08);color:var(--B);font-size:10px;font-weight:700;
}
.tdd-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--BD);
  transition:background var(--t);
}
.tdd-item:last-child{border-bottom:none}
.tdd-item:hover,.tdd-item.kbf{background:#eff6ff}
.tdd-thumb{
  width:36px;height:36px;border-radius:var(--r8);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.tdd-name{font-size:13px;font-weight:600;color:var(--TX)}
.tdd-name mark{background:#dbeafe;color:var(--B);border-radius:2px;padding:0 2px;font-weight:700;font-style:normal}
.tdd-sub{font-size:11px;color:var(--TX3);margin-top:2px;display:flex;align-items:center;gap:6px}
.tdd-tag{
  padding:1px 7px;border-radius:var(--r99);font-size:10px;font-weight:600;
}
.tdd-empty{padding:20px;text-align:center;font-size:13px;color:var(--TX3)}

/* Top right tools */
.top-tools{display:flex;align-items:center;gap:6px;padding:0 16px;margin-left:auto;flex-shrink:0}
.top-btn{
  display:flex;align-items:center;gap:5px;
  padding:6px 12px;border-radius:var(--r6);font-size:12px;font-weight:500;
  border:1.5px solid var(--BD);color:var(--TX2);background:#fff;
  transition:all var(--t);white-space:nowrap;
}
.top-btn:hover{border-color:var(--Bl);color:var(--B)}
.top-btn.solid{background:var(--B);color:#fff;border-color:var(--B)}
.top-btn.solid:hover{background:var(--Bd)}
.top-btn i{font-size:11px}
.top-sep{width:1px;height:20px;background:var(--BD)}

/* Basemap pills */
.bm-pills{display:flex;border:1.5px solid var(--BD);border-radius:var(--r6);overflow:hidden}
.bm-p{
  padding:5px 11px;font-size:11.5px;font-weight:500;color:var(--TX3);
  border-right:1px solid var(--BD);transition:all var(--t);display:flex;align-items:center;gap:5px;
}
.bm-p:last-child{border-right:none}
.bm-p i{font-size:10px}
.bm-p:hover{background:var(--BG);color:var(--TX)}
.bm-p.on{background:var(--B);color:#fff;border-color:var(--B)}

/* =============== MAIN LAYOUT =============== */
#shell{
  display:flex;height:100vh;padding-top:var(--TOP);
}

/* =============== LEFT PANEL =============== */
#panel{
  width:var(--PANEL);flex-shrink:0;
  display:flex;flex-direction:column;
  background:#fff;border-right:1px solid var(--BD);
  overflow:hidden;z-index:100;
}

/* Filter strip */
.filter-strip{
  padding:12px 14px;border-bottom:1px solid var(--BD);
  display:flex;flex-direction:column;gap:10px;flex-shrink:0;
}
.filter-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.filter-lbl{font-size:11px;font-weight:700;color:var(--TX3);text-transform:uppercase;letter-spacing:.4px;width:100%}
.chip{
  display:flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:var(--r99);font-size:12px;font-weight:500;
  border:1.5px solid var(--BD);color:var(--TX2);background:#fff;
  cursor:pointer;transition:all var(--t);user-select:none;
}
.chip:hover{border-color:var(--Bl);color:var(--B)}
.chip.on{background:var(--B);color:#fff;border-color:var(--B)}
.chip i{font-size:10px}
.chip .c-cnt{
  background:rgba(255,255,255,.25);padding:0 6px;border-radius:var(--r99);
  font-size:10px;font-weight:700;
}
.chip:not(.on) .c-cnt{background:var(--S2);color:var(--TX3)}

/* Sort row */
.sort-row{
  padding:10px 14px;border-bottom:1px solid var(--BD);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.sort-total{font-size:12.5px;font-weight:600;color:var(--TX)}
.sort-total span{color:var(--B)}
.sort-sel{
  display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;
  color:var(--TX2);cursor:pointer;
}
.sort-sel select{
  font-family:inherit;font-size:12px;font-weight:500;color:var(--TX2);
  border:1px solid var(--BD);background:#fff;border-radius:var(--r6);
  padding:4px 8px;cursor:pointer;outline:none;
}
.sort-sel select:focus{border-color:var(--B)}

/* Card list */
#card-list{
  flex:1;overflow-y:auto;padding:12px;
  display:flex;flex-direction:column;gap:8px;
}
.zone-card{
  border:1.5px solid var(--BD);border-radius:var(--r12);
  background:#fff;cursor:pointer;
  transition:all var(--t);overflow:hidden;
  position:relative;
}
.zone-card:hover{border-color:var(--Bl);box-shadow:var(--sh2);transform:translateY(-1px)}
.zone-card.active{border-color:var(--B);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.zc-accent{height:4px;width:100%}
.zc-body{padding:12px}
.zc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.zc-name{font-size:14px;font-weight:700;color:var(--TX);line-height:1.3}
.zc-badge{
  padding:3px 9px;border-radius:var(--r99);font-size:10px;font-weight:700;flex-shrink:0;
}
.zc-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.zc-stat{
  padding:7px 8px;background:var(--BG);border-radius:var(--r6);
  display:flex;flex-direction:column;gap:2px;
}
.zc-stat-v{font-size:13px;font-weight:700;color:var(--TX)}
.zc-stat-k{font-size:9.5px;color:var(--TX3);font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.zc-foot{display:flex;align-items:center;justify-content:space-between}
.zc-id{font-size:10.5px;color:var(--TX4)}
.zc-btns{display:flex;gap:5px}
.zc-btn{
  padding:5px 10px;border-radius:var(--r6);font-size:11px;font-weight:600;
  background:rgba(37,99,235,.06);color:var(--B);border:1px solid rgba(37,99,235,.15);
  transition:all var(--t);
}
.zc-btn:hover{background:var(--B);color:#fff}
.zc-note{
  margin-top:8px;padding:7px 10px;background:#f0f9ff;border-radius:var(--r6);
  font-size:11px;color:#0369a1;border-left:3px solid #38bdf8;
  display:none;line-height:1.5;
}
.zone-card:hover .zc-note{display:block}

/* Empty state */
.list-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:32px;text-align:center;
}
.list-empty i{font-size:36px;color:var(--S3)}
.list-empty p{font-size:13px;color:var(--TX3);line-height:1.6}

/* =============== MAP =============== */
#map{flex:1;position:relative}
#leafmap{width:100%;height:100%}

/* Map floating overlay top-right */
#map-legend{
  position:absolute;top:14px;right:14px;z-index:500;
  background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
  border:1px solid var(--BD);border-radius:var(--r12);
  padding:12px;box-shadow:var(--sh2);min-width:160px;
  transition:all var(--t);
}
.ml-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--TX3);margin-bottom:8px}
.ml-item{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.ml-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.ml-name{font-size:11.5px;color:var(--TX2);font-weight:500}

/* Map coords */
#map-coords{
  position:absolute;bottom:28px;left:14px;z-index:500;
  background:rgba(255,255,255,.92);backdrop-filter:blur(4px);
  border:1px solid var(--BD);border-radius:var(--r99);
  padding:5px 12px;font-size:11.5px;color:var(--TX3);
  box-shadow:var(--sh1);pointer-events:none;
}
#map-coords span{font-weight:600;color:var(--TX2)}

/* Floating toolbar */
#map-tb{
  position:absolute;bottom:60px;right:14px;z-index:500;
  display:flex;flex-direction:column;gap:5px;
}
.mbt{
  width:36px;height:36px;border-radius:var(--r8);
  background:rgba(255,255,255,.96);backdrop-filter:blur(6px);
  border:1px solid var(--BD);box-shadow:var(--sh1);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--TX2);cursor:pointer;transition:all var(--t);
}
.mbt:hover{color:var(--B);border-color:var(--Bl);background:#fff}
.mbt.on{background:var(--B);color:#fff;border-color:var(--B)}

/* Leaflet */
.leaflet-popup-content-wrapper{
  border-radius:var(--r12)!important;box-shadow:0 8px 24px rgba(0,0,0,.15)!important;
  border:1px solid var(--BD);padding:0!important;overflow:hidden;
}
.leaflet-popup-content{margin:0!important;font-family:'Inter',sans-serif;min-width:200px}
.leaflet-popup-tip-container{display:none}
.leaflet-control-zoom{border:1px solid var(--BD)!important;border-radius:var(--r8)!important;box-shadow:var(--sh1)!important}
.leaflet-control-zoom a{color:var(--TX2)!important;font-size:15px!important}
.leaflet-control-zoom a:hover{background:var(--BG)!important;color:var(--B)!important}
.leaflet-control-scale-line{font-family:'Inter',sans-serif!important;font-size:10px!important;background:rgba(255,255,255,.8)!important}
.zone-label{
  background:transparent!important;border:none!important;box-shadow:none!important;
  font-family:'Inter',sans-serif;font-size:11px;font-weight:700;color:#111827;
  text-shadow:1px 1px 0 #fff,-1px 1px 0 #fff,1px -1px 0 #fff,-1px -1px 0 #fff,0 0 3px #fff;
  pointer-events:none;white-space:nowrap;
}

/* Popup */
.pu-head{padding:12px 14px;color:#fff;position:relative;overflow:hidden}
.pu-head::before{content:'';position:absolute;right:-16px;top:-16px;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.1)}
.pu-head h4{font-size:13px;font-weight:700;position:relative}
.pu-head small{font-size:10px;opacity:.75;position:relative}
.pu-body{padding:10px 14px}
.pu-row{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--BD);font-size:12px}
.pu-row:last-child{border-bottom:none}
.pu-k{color:var(--TX3);font-weight:500;min-width:80px}
.pu-v{font-weight:600;color:var(--TX)}
.pu-btn{
  display:block;margin:10px 14px 12px;padding:8px;
  background:var(--B);color:#fff;border-radius:var(--r8);
  text-align:center;font-size:12px;font-weight:600;cursor:pointer;
  transition:background var(--t);
}
.pu-btn:hover{background:var(--Bd)}

/* =============== RESPONSIVE =============== */
@media(max-width:768px){
  :root{--PANEL:0px}
  #panel{position:absolute;left:-340px;width:340px;top:var(--TOP);bottom:0;z-index:800;
    transition:left var(--t);border-right:none;box-shadow:var(--sh3)}
  #panel.open{left:0}
  .top-logo{min-width:auto;padding:0 14px}
  .top-logo-txt{display:none}
}
</style>
</head>
<body>

<!-- LOADER -->
<div id="ld">
  <div class="ld-logo">
    <div class="ld-ico">QH</div>
    <div class="ld-name">GIS<span>Toan Quoc</span></div>
  </div>
  <div class="ld-dots">
    <div class="ld-dot"></div><div class="ld-dot"></div><div class="ld-dot"></div>
  </div>
  <div class="ld-msg" id="ld-msg">Dang tai du lieu...</div>
</div>

<!-- TOP BAR -->
<header id="top">
  <a class="top-logo" href="#">
    <div class="top-logo-ico">QH</div>
    <div class="top-logo-txt">
      <div class="n1">GIS<span>Quy Hoach</span></div>
      <div class="n2">Dia phan hanh chinh Viet Nam 2026</div>
    </div>
  </a>

  <div class="top-search-wrap">
    <div class="top-search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="top-inp" type="text" placeholder="Tim kiem tinh, xa, phuong toan quoc..." autocomplete="off"/>
      <button id="top-inp-clear"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="top-dd"></div>
  </div>

  <div class="top-tools">
    <!-- Basemap -->
    <div class="bm-pills" id="bm-pills">
      <button class="bm-p on" data-bm="streets"><i class="fa-solid fa-map"></i>Ban do</button>
      <button class="bm-p" data-bm="satellite"><i class="fa-solid fa-satellite"></i>Ve tinh</button>
      <button class="bm-p" data-bm="light"><i class="fa-solid fa-sun"></i>Sang</button>
    </div>
    <div class="top-sep"></div>
    <button class="top-btn" id="btn-fs" title="Toan man hinh"><i class="fa-solid fa-expand"></i></button>
    <button class="top-btn solid" id="btn-share" title="Chia se">
      <i class="fa-solid fa-share-nodes"></i>Chia se
    </button>
  </div>
</header>

<!-- SHELL -->
<div id="shell">

  <!-- LEFT PANEL -->
  <div id="panel">

    <!-- Filter chips -->
    <div class="filter-strip">
      <div class="filter-row">
        <span class="filter-lbl">Loai don vi</span>
        <div class="chip on" data-f="all" id="cf-all">
          <i class="fa-solid fa-layer-group"></i>Tat ca
          <span class="c-cnt" id="cc-all">0</span>
        </div>
        <div class="chip" data-f="tinh" id="cf-ph">
          <i class="fa-solid fa-map"></i>Tinh/TP
          <span class="c-cnt" id="cc-ph">0</span>
        </div>
        <div class="chip" data-f="xa" id="cf-xa">
          <i class="fa-solid fa-city"></i>Xa/Phuong
          <span class="c-cnt" id="cc-xa">0</span>
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-lbl">Hien thi</span>
        <div class="chip on" id="cf-lbl" title="Nhan ten">
          <i class="fa-solid fa-tags"></i>Nhan ten
        </div>
        <div class="chip on" id="cf-layer" title="Lop ranh gioi">
          <i class="fa-solid fa-draw-polygon"></i>Ranh gioi
        </div>
      </div>
    </div>

    <!-- Sort row -->
    <div class="sort-row">
      <div class="sort-total">Tim thay <span id="visible-cnt">0</span> don vi</div>
      <div class="sort-sel">
        <i class="fa-solid fa-arrow-down-wide-short" style="font-size:11px;color:var(--TX3)"></i>
        <select id="sort-sel">
          <option value="name">Ten A-Z</option>
          <option value="area">Dien tich lon nhat</option>
          <option value="pop">Dan so cao nhat</option>
        </select>
      </div>
    </div>

    <!-- Card list -->
    <div id="card-list"></div>
  </div>

  <!-- MAP -->
  <div id="map">
    <div id="leafmap"></div>

    <!-- Legend -->
    <div id="map-legend">
      <div class="ml-title">Chu giai</div>
      <div class="ml-item"><div class="ml-dot" style="background:#2563eb"></div><span class="ml-name">Tinh/Thanh pho</span></div>
      <div class="ml-item"><div class="ml-dot" style="background:#16a34a"></div><span class="ml-name">Xa/Phuong/TT</span></div>
      <div class="ml-item"><div class="ml-dot" style="background:#f59e0b"></div><span class="ml-name">Khac</span></div>
    </div>

    <!-- Coords -->
    <div id="map-coords">
      <span id="mc-lat">16.0544</span>° B, <span id="mc-lng">108.2022</span>° D
    </div>

    <!-- Toolbar -->
    <div id="map-tb">
      <div class="mbt" id="mbt-home" title="Ve trung tam"><i class="fa-solid fa-house"></i></div>
      <div class="mbt" id="mbt-fit" title="Hien thi toan bo"><i class="fa-solid fa-maximize"></i></div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';

// ============================================================
// CONFIG
// ============================================================
const CFG = {
  center:[16.5,106.0], zoom:6,
  data:'https://cdn.jsdelivr.net/gh/akutindn/gisquyhoach@main/map/tinh_2026.geojson',
  dataXa:'https://cdn.jsdelivr.net/gh/akutindn/gisquyhoach@main/map/xa_2026.geojson'
};
const COLORS = {
  tinh:  { fill:'#2563eb', border:'#1e40af', light:'rgba(37,99,235,.08)', badge:'rgba(37,99,235,.1)', badgeText:'#1e40af' },
  xa:    { fill:'#16a34a', border:'#14532d', light:'rgba(22,163,74,.08)',  badge:'rgba(22,163,74,.1)',  badgeText:'#14532d' },
  other: { fill:'#f59e0b', border:'#b45309', light:'rgba(245,158,11,.08)', badge:'rgba(245,158,11,.1)', badgeText:'#92400e' },
};

// ============================================================
// STATE
// ============================================================
let map, geoLayer, labelsGroup;
let allFeatures = [];
let activeFilter = 'all';
let showLabels = true, showLayer = true;
let opacity = 0.6;
let activeCard = null, activeLeafLayer = null;
let sortBy = 'name';

// ============================================================
// HELPERS
// ============================================================
const $=id=>document.getElementById(id);
const san=v=>(!v||String(v).includes('null'))? '': String(v).trim();
const fmtN=(v,d=0)=>{ const n=parseFloat(v); return isNaN(n)||n<=0?'':n.toLocaleString('vi-VN',{maximumFractionDigits:d}); };
const fmtArea=v=>{ const s=fmtN(v); return s?s+' ha':''; };
const fmtPop=v=>{ const s=fmtN(v); return s?s+' ng':''; };
const typeOf=p=>{
  // Uu tien tenTinh (cap tinh), tenXa (cap xa)
  if(p.tenTinh && !p.tenXa) return 'tinh';
  if(p.tenXa) return 'xa';
  // fallback theo tenDoiTuon cu (Da Nang data)
  const n=san(p.tenDoiTuon||'');
  if(n.startsWith('Ph')) return 'xa';
  if(n.startsWith('X'))  return 'xa';
  return 'other';
};
const nameOf=p=>san(p.tenXa||p.tenTinh||p.tenDoiTuon||'');
const colorOf=p=>COLORS[typeOf(p)];

// ============================================================
// MAP
// ============================================================
function initMap(){
  map=L.map('leafmap',{center:CFG.center,zoom:CFG.zoom,zoomControl:false,attributionControl:false});
  L.control.zoom({position:'bottomright'}).addTo(map);
  L.control.scale({position:'bottomright',metric:true,imperial:false}).addTo(map);

  const tiles={
    streets:L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}),
    satellite:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}),
    light:L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:20}),
  };
  tiles.streets.addTo(map);

  document.querySelectorAll('.bm-p').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.bm-p').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      Object.values(tiles).forEach(l=>map.removeLayer(l));
      tiles[b.dataset.bm].addTo(map);
    });
  });

  map.on('mousemove',e=>{
    $('mc-lat').textContent=e.latlng.lat.toFixed(5);
    $('mc-lng').textContent=e.latlng.lng.toFixed(5);
  });
  window.map=map;
}

// ============================================================
// STYLE
// ============================================================
function styleFor(f){
  const c=colorOf(f.properties);
  const t=typeOf(f.properties);
  let fill=opacity;
  if(activeFilter!=='all'&&t!==activeFilter) fill=0;
  return {fillColor:c.fill,fillOpacity:fill,color:c.border,weight:1.2,opacity:.9};
}

function onEach(f,layer){
  layer.on({
    mouseover(e){
      if(activeLeafLayer!==e.target){
        const c=colorOf(f.properties);
        e.target.setStyle({weight:3,color:c.border,fillOpacity:Math.min(opacity+.25,1)});
        e.target.bringToFront();
      }
    },
    mouseout(e){ if(activeLeafLayer!==e.target) geoLayer.resetStyle(e.target); },
    click(e){
      selectFeature(f,e.target,true);
    }
  });
}

function selectFeature(f,leafLayer,fromMap){
  // Reset prev
  if(activeLeafLayer) geoLayer.resetStyle(activeLeafLayer);
  activeLeafLayer=leafLayer;

  // Highlight
  if(leafLayer){
    const c=colorOf(f.properties);
    leafLayer.setStyle({weight:3,color:c.border,fillOpacity:Math.min(opacity+.3,1)});
    leafLayer.bringToFront();
    if(fromMap) map.fitBounds(leafLayer.getBounds(),{padding:[60,60]});
  }

  // Show popup on map
  const p=f.properties;
  const name=nameOf(p);
  const c=colorOf(p);
  const t=typeOf(p);
  const typeLbl=t==='tinh'?'Tinh/TP':t==='xa'?'Xa/Phuong':'Don vi';
  const area=fmtArea(p.dienTich||(p.SHAPE_Area/10000)||p.dienTichQH);
  const pop=fmtPop(p.danSo||p.danSoHienT);
  const id=parseInt(p.OBJECTID)||'?';

  if(leafLayer){
    const center=leafLayer.getBounds().getCenter();
    L.popup({closeButton:true,className:''})
      .setLatLng(center)
      .setContent(
        '<div id="popup-feature">'
        +'<div class="pu-head" style="background:linear-gradient(135deg,'+c.fill+','+c.border+')">'
        +'<h4>'+name+'</h4>'
        +'<small>#'+id+' &bull; '+typeLbl+'</small>'
        +'</div><div class="pu-body">'
        +(area?'<div class="pu-row"><span class="pu-k">Dien tich</span><span class="pu-v">'+area+'</span></div>':'')
        +(pop?'<div class="pu-row"><span class="pu-k">Dan so</span><span class="pu-v">'+pop+'</span></div>':'')
        +'</div>'
        +'<div class="pu-btn" onclick="document.getElementById(\'cf-all\').click()">Xem danh sach</div>'
        +'</div>'
      ).openOn(map);
  }

  // Sync card
  const cardEl=$('card-'+id);
  if(cardEl){
    if(activeCard) activeCard.classList.remove('active');
    activeCard=cardEl; cardEl.classList.add('active');
    cardEl.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}

// ============================================================
// LABELS
// ============================================================
function renderLabels(){
  if(labelsGroup){ labelsGroup.remove(); labelsGroup=null; }
  if(!showLabels||!allFeatures.length) return;
  const ms=[];
  allFeatures.forEach(f=>{
    const name=san(f.properties.tenDoiTuon);
    if(!name) return;
    const t=typeOf(f.properties);
    if(activeFilter!=='all'&&t!==activeFilter) return;
    try{
      const c=L.geoJSON(f).getBounds().getCenter();
      ms.push(L.tooltip({permanent:true,direction:'center',className:'zone-label'}).setLatLng(c).setContent(name));
    }catch(e){}
  });
  labelsGroup=L.layerGroup(ms).addTo(map);
}

// ============================================================
// CARD LIST
// ============================================================
function buildCards(features){
  const list=$('card-list');
  if(!features.length){
    list.innerHTML='<div class="list-empty"><i class="fa-solid fa-map-location-dot"></i><p>Khong tim thay ket qua.<br>Vui long thu lai voi tu khoa khac.</p></div>';
    return;
  }
  $('visible-cnt').textContent=features.length;

  list.innerHTML=features.map(f=>{
    const p=f.properties;
    const name=nameOf(p)||'Don vi #'+p.OBJECTID;
    const t=typeOf(p);
    const c=COLORS[t];
    const typeLbl=t==='tinh'?'Tinh/TP':t==='xa'?'Xa/Phuong':'Don vi';
    const area=fmtArea(p.dienTich||(p.SHAPE_Area/10000)||p.dienTichQH);
    const pop=fmtPop(p.danSo||p.danSoHienT);
    const note=san(p.ghiChu||p.nghiQuyet||'');
    const id=parseInt(p.OBJECTID)||0;

    return '<div class="zone-card" id="card-'+id+'" data-id="'+id+'" onclick="onCardClick('+id+')">'
      +'<div class="zc-accent" style="background:'+c.fill+'"></div>'
      +'<div class="zc-body">'
      +'<div class="zc-top">'
      +'<div class="zc-name">'+name+'</div>'
      +'<div class="zc-badge" style="background:'+c.badge+';color:'+c.badgeText+'">'+typeLbl+'</div>'
      +'</div>'
      +'<div class="zc-stats">'
      +(area?'<div class="zc-stat"><div class="zc-stat-v" style="color:'+c.fill+'">'+area+'</div><div class="zc-stat-k">Dien tich</div></div>':'')
      +(pop?'<div class="zc-stat"><div class="zc-stat-v">'+pop+'</div><div class="zc-stat-k">Dan so</div></div>':'')
      +'<div class="zc-stat"><div class="zc-stat-v" style="color:var(--TX3);font-size:11px">#'+id+'</div><div class="zc-stat-k">Ma so</div></div>'
      +'</div>'
      +'<div class="zc-foot">'
      +'<span class="zc-id"><i class="fa-solid fa-location-dot" style="color:'+c.fill+';margin-right:4px"></i>'+(p.tenTinh||'Viet Nam')+'</span>'
      +'<div class="zc-btns">'
      +'<button class="zc-btn" onclick="event.stopPropagation();zoomToId('+id+')"><i class="fa-solid fa-maximize"></i>Zoom</button>'
      +'</div></div>'
      +(note?'<div class="zc-note"><i class="fa-solid fa-circle-info" style="margin-right:5px;color:#38bdf8"></i>'+note+'</div>':'')
      +'</div></div>';
  }).join('');
}

// Feature map indexed by OBJECTID
const featMap={};
const leafMap={};  // OBJECTID -> leaflet layer

function onCardClick(id){
  const f=featMap[id];
  const l=leafMap[id];
  if(!f) return;
  selectFeature(f,l,true);
}
function zoomToId(id){
  const l=leafMap[id];
  if(l) map.fitBounds(l.getBounds(),{padding:[80,80]});
}

// ============================================================
// FILTER & SORT
// ============================================================
function getFiltered(q){
  let list=allFeatures;
  if(activeFilter!=='all') list=list.filter(f=>typeOf(f.properties)===activeFilter||typeOf(f.properties)===(activeFilter==='tinh'?'tinh':activeFilter));
  if(q){
    const lq=q.toLowerCase();
    list=list.filter(f=>nameOf(f.properties).toLowerCase().includes(lq)||(f.properties.tenTinh||'').toLowerCase().includes(lq));
  }
  // sort
  list=[...list];
  if(sortBy==='area') list.sort((a,b)=>(parseFloat(b.properties.dienTichQH)||0)-(parseFloat(a.properties.dienTichQH)||0));
  else if(sortBy==='pop') list.sort((a,b)=>(parseInt(b.properties.danSoHienT)||0)-(parseInt(a.properties.danSoHienT)||0));
  else list.sort((a,b)=>san(a.properties.tenDoiTuon).localeCompare(san(b.properties.tenDoiTuon),'vi'));
  return list;
}

function applyFilter(q){
  const list=getFiltered(q||'');
  buildCards(list);
  if(geoLayer) geoLayer.setStyle(styleFor.bind(null));
  geoLayer?.eachLayer(l=>{ if(l.feature) l.setStyle(styleFor(l.feature)); });
  renderLabels();
}

function setupFilters(){
  ['cf-all','cf-ph','cf-xa'].forEach(id=>{
    $(id).addEventListener('click',()=>{
      ['cf-all','cf-ph','cf-xa'].forEach(x=>$(x).classList.remove('on'));
      $(id).classList.add('on');
      activeFilter={['cf-all']:'all',['cf-ph']:'tinh',['cf-xa']:'xa'}[id]||'all';
      applyFilter($('top-inp').value);
    });
  });

  $('cf-lbl').addEventListener('click',()=>{
    showLabels=!showLabels;
    $('cf-lbl').classList.toggle('on',showLabels);
    renderLabels();
  });
  $('cf-layer').addEventListener('click',()=>{
    showLayer=!showLayer;
    $('cf-layer').classList.toggle('on',showLayer);
    if(!geoLayer) return;
    showLayer?geoLayer.addTo(map):geoLayer.remove();
  });

  $('sort-sel').addEventListener('change',e=>{
    sortBy=e.target.value;
    applyFilter($('top-inp').value);
  });
}

// ============================================================
// SEARCH
// ============================================================
function setupSearch(){
  const inp=$('top-inp'), clr=$('top-inp-clear'), dd=$('top-dd');
  let hits=[], kidx=-1;

  const hl=(text,q)=>{
    if(!q) return text;
    const i=text.toLowerCase().indexOf(q.toLowerCase());
    if(i<0) return text;
    return text.slice(0,i)+'<mark>'+text.slice(i,i+q.length)+'</mark>'+text.slice(i+q.length);
  };

  function renderDD(list,q){
    kidx=-1; hits=list;
    if(!list.length){
      dd.innerHTML='<div class="tdd-empty"><i class="fa-solid fa-magnifying-glass" style="margin-right:5px;color:#cbd5e1"></i>Khong tim thay ket qua</div>';
      dd.style.display='block'; return;
    }
    const COLORS2={phuong:{lbl:'Phuong',c:'#2563eb',bg:'rgba(37,99,235,.08)',ico:'fa-city'},xa:{lbl:'Xa',c:'#16a34a',bg:'rgba(22,163,74,.08)',ico:'fa-tree'},other:{lbl:'Don vi',c:'#94a3b8',bg:'rgba(148,163,184,.08)',ico:'fa-map'}};
    dd.innerHTML='<div class="tdd-hdr">'+(q?'Ket qua':'Tat ca don vi')+' <span class="tdd-cnt">'+list.length+'</span></div>'
      +list.map((it,i)=>{
        const t=COLORS2[typeOf(it.feature.properties)]||COLORS2.other;
        const area=fmtArea(it.feature.properties.dienTichQH||(it.feature.properties.Shape_Area/10000));
        return '<div class="tdd-item" data-i="'+i+'">'
          +'<div class="tdd-thumb" style="background:'+t.bg+'"><i class="fa-solid '+t.ico+'" style="color:'+t.c+'"></i></div>'
          +'<div style="flex:1;min-width:0">'
          +'<div class="tdd-name">'+hl(it.name,q)+'</div>'
          +'<div class="tdd-sub"><span class="tdd-tag" style="background:'+t.bg+';color:'+t.c+'">'+t.lbl+'</span>'+(area?area:'')+'</div>'
          +'</div>'
          +'<i class="fa-solid fa-chevron-right" style="font-size:10px;color:#d1d5db;flex-shrink:0"></i>'
          +'</div>';
      }).join('');
    dd.style.display='block';
    dd.querySelectorAll('.tdd-item').forEach(el=>{
      el.addEventListener('click',()=>pick(parseInt(el.dataset.i)));
      el.addEventListener('mouseenter',()=>{
        dd.querySelectorAll('.tdd-item').forEach(e=>e.classList.remove('kbf'));
        el.classList.add('kbf'); kidx=parseInt(el.dataset.i);
      });
    });
  }

  function pick(i){
    const it=hits[i]; if(!it) return;
    inp.value=it.name; clr.style.display='inline-flex';
    dd.style.display='none'; inp.blur();
    applyFilter(it.name);
    const id=parseInt(it.feature.properties.OBJECTID)||0;
    const l=leafMap[id];
    selectFeature(it.feature,l,true);
  }

  function search(q){
    q=(q||'').trim(); clr.style.display=q?'inline-flex':'none';
    if(!allFeatures.length){ dd.style.display='none'; return; }
    applyFilter(q);
    let list;
    if(!q){
      list=allFeatures.map(f=>({name:nameOf(f.properties),feature:f})).sort((a,b)=>a.name.localeCompare(b.name,'vi'));
    } else {
      const lq=q.toLowerCase();
      list=allFeatures.map(f=>({name:nameOf(f.properties),feature:f}))
        .filter(it=>it.name.toLowerCase().includes(lq)||(it.feature.properties.tenTinh||'').toLowerCase().includes(lq))
        .sort((a,b)=>{
          const as=a.name.toLowerCase().startsWith(lq), bs=b.name.toLowerCase().startsWith(lq);
          return as===bs?a.name.localeCompare(b.name,'vi'):as?-1:1;
        });
    }
    renderDD(list,q);
  }

  inp.addEventListener('input',e=>search(e.target.value));
  inp.addEventListener('click',()=>search(inp.value));
  inp.addEventListener('focus',()=>search(inp.value));
  inp.addEventListener('keydown',e=>{
    const its=dd.querySelectorAll('.tdd-item');
    if(!its.length) return;
    if(e.key==='ArrowDown'){e.preventDefault();kidx=Math.min(kidx+1,its.length-1);its.forEach((el,i)=>el.classList.toggle('kbf',i===kidx));its[kidx]?.scrollIntoView({block:'nearest'});}
    else if(e.key==='ArrowUp'){e.preventDefault();kidx=Math.max(kidx-1,0);its.forEach((el,i)=>el.classList.toggle('kbf',i===kidx));its[kidx]?.scrollIntoView({block:'nearest'});}
    else if(e.key==='Enter'){e.preventDefault();if(kidx>=0)pick(kidx);else if(hits.length===1)pick(0);}
    else if(e.key==='Escape'){dd.style.display='none';inp.blur();}
  });
  clr.addEventListener('click',()=>{ inp.value=''; clr.style.display='none'; dd.style.display='none'; hits=[]; applyFilter(''); inp.focus(); });
  document.addEventListener('click',e=>{ if(!e.target.closest('.top-search-wrap')) dd.style.display='none'; });
}

// ============================================================
// TOOLBAR & HEADER
// ============================================================
function setupTools(){
  $('mbt-home').addEventListener('click',()=>map.setView(CFG.center,CFG.zoom));
  $('mbt-fit').addEventListener('click',()=>{ if(geoLayer) map.fitBounds(geoLayer.getBounds(),{padding:[20,20]}); });

  $('btn-fs').addEventListener('click',()=>{
    if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  });
  document.addEventListener('fullscreenchange',()=>{
    $('btn-fs').innerHTML=document.fullscreenElement?'<i class="fa-solid fa-compress"></i>':'<i class="fa-solid fa-expand"></i>';
  });

  $('btn-share').addEventListener('click',()=>{
    navigator.clipboard?.writeText(window.location.href);
    const orig=$('btn-share').innerHTML;
    $('btn-share').innerHTML='<i class="fa-solid fa-check"></i>Da sao chep!';
    setTimeout(()=>$('btn-share').innerHTML=orig,2000);
  });
}

// ============================================================
// COUNTS
// ============================================================
function updateCounts(){
  let cTinh=0,cXa=0;
  allFeatures.forEach(f=>{ const t=typeOf(f.properties); if(t==='tinh')cTinh++;else if(t==='xa')cXa++; });
  $('cc-all').textContent=allFeatures.length;
  $('cc-ph').textContent=cTinh;
  $('cc-xa').textContent=cXa;
  $('visible-cnt').textContent=allFeatures.length;
}

// ============================================================
// BOOT
// ============================================================
async function boot(){
  try{
    $('ld-msg').textContent='Khoi tao ban do...';
    initMap(); setupFilters(); setupSearch(); setupTools();

    // Load ca 2 lop: Tinh va Xa song song
    $('ld-msg').textContent='Dang tai du lieu toan quoc...';
    const [resTinh, resXa] = await Promise.all([
      fetch(CFG.data),
      fetch(CFG.dataXa)
    ]);
    if(!resTinh.ok) throw new Error('HTTP Tinh: '+resTinh.status);
    if(!resXa.ok)   throw new Error('HTTP Xa: '+resXa.status);

    const [gjTinh, gjXa] = await Promise.all([resTinh.json(), resXa.json()]);

    // Gop 2 lop lai
    const gj = { type:'FeatureCollection', features: [...gjTinh.features, ...gjXa.features] };
    $('ld-msg').textContent='Dang hien thi '+gj.features.length+' don vi...';
    allFeatures=gj.features;

    // Index
    allFeatures.forEach(f=>{
      const id=parseInt(f.properties.OBJECTID)||0;
      featMap[id]=f;
    });

    // Render GeoJSON
    geoLayer=L.geoJSON(gj,{
      style:f=>styleFor(f),
      onEachFeature:(f,layer)=>{
        const id=parseInt(f.properties.OBJECTID)||0;
        leafMap[id]=layer;
        onEach(f,layer);
      }
    }).addTo(map);
    window.geoJsonLayer=geoLayer;

    map.fitBounds(geoLayer.getBounds(),{padding:[20,20]});
    updateCounts();
    applyFilter('');
    renderLabels();

    // Hide loader
    const ld=$('ld');
    ld.style.opacity='0'; ld.style.pointerEvents='none';
    setTimeout(()=>ld.style.display='none',450);

  }catch(err){
    console.error(err);
    $('ld-msg').textContent='Loi: '+err.message;
    $('ld-msg').style.color='#ef4444';
  }
}

document.addEventListener('DOMContentLoaded',boot);
</script>
</body>
</html>
